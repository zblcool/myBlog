name: Deploy Astro Site To Pages Repo

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve deployment target
        env:
          TARGET_PAGES_REPOSITORY: ${{ vars.TARGET_PAGES_REPOSITORY }}
          TARGET_PAGES_BRANCH: ${{ vars.TARGET_PAGES_BRANCH }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          set -eu

          TARGET_REPOSITORY="${TARGET_PAGES_REPOSITORY:-zblcool/zblcool.github.io}"
          TARGET_BRANCH="${TARGET_PAGES_BRANCH:-master}"
          TARGET_OWNER="${TARGET_REPOSITORY%%/*}"
          TARGET_NAME="${TARGET_REPOSITORY##*/}"

          if [ -n "${SITE_URL:-}" ]; then
            FINAL_SITE_URL="${SITE_URL}"
          else
            FINAL_SITE_URL="https://${TARGET_NAME}"
          fi

          if [ -n "${BASE_PATH:-}" ]; then
            FINAL_BASE_PATH="${BASE_PATH}"
          elif [ "${TARGET_NAME}" = "${TARGET_OWNER}.github.io" ]; then
            FINAL_BASE_PATH="/"
          else
            FINAL_BASE_PATH="/${TARGET_NAME}/"
          fi

          {
            echo "TARGET_REPOSITORY=${TARGET_REPOSITORY}"
            echo "TARGET_BRANCH=${TARGET_BRANCH}"
            echo "FINAL_SITE_URL=${FINAL_SITE_URL}"
            echo "FINAL_BASE_PATH=${FINAL_BASE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Build Astro site
        env:
          SITE_URL: ${{ env.FINAL_SITE_URL }}
          BASE_PATH: ${{ env.FINAL_BASE_PATH }}
          CNAME_DOMAIN: ${{ vars.CNAME_DOMAIN }}
        run: yarn build

      - name: Configure SSH for target repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          PAGES_DEPLOY_KEY_PASSPHRASE: ${{ secrets.PAGES_DEPLOY_KEY_PASSPHRASE }}
        run: |
          set -eu

          if [ -z "${PAGES_DEPLOY_KEY:-}" ]; then
            echo "Missing required secret: PAGES_DEPLOY_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$PAGES_DEPLOY_KEY" | grep -Eq "BEGIN (OPENSSH|RSA|EC|DSA|PRIVATE) PRIVATE KEY"; then
            printf '%s' "$PAGES_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/pages_deploy_key
          else
            printf '%s' "$PAGES_DEPLOY_KEY" | tr -d '\r' | base64 --decode > ~/.ssh/pages_deploy_key
          fi
          chmod 600 ~/.ssh/pages_deploy_key

          if ssh-keygen -y -f ~/.ssh/pages_deploy_key >/dev/null 2>&1; then
            :
          elif [ -n "${PAGES_DEPLOY_KEY_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)" >/dev/null

            cat <<'EOF' > ~/.ssh/pages_deploy_key_askpass
          #!/usr/bin/env sh
          printf '%s\n' "$PAGES_DEPLOY_KEY_PASSPHRASE"
          EOF
            chmod 700 ~/.ssh/pages_deploy_key_askpass

            if ! DISPLAY=:0 SSH_ASKPASS=~/.ssh/pages_deploy_key_askpass SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/pages_deploy_key </dev/null >/dev/null 2>&1; then
              echo "PAGES_DEPLOY_KEY could not be unlocked with PAGES_DEPLOY_KEY_PASSPHRASE." >&2
              echo "If this key has a passphrase, store that passphrase in the PAGES_DEPLOY_KEY_PASSPHRASE secret." >&2
              exit 1
            fi
          else
            echo "PAGES_DEPLOY_KEY is not a valid SSH private key, or it is passphrase-protected." >&2
            echo "Store the raw private key or a base64-encoded copy of the private key in the secret." >&2
            echo "Do not use the public key. If the private key has a passphrase, add PAGES_DEPLOY_KEY_PASSPHRASE as well." >&2
            exit 1
          fi

          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat <<'EOF' > ~/.ssh/config
          Host github-pages-target
            HostName github.com
            User git
            IdentityFile ~/.ssh/pages_deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish dist to target Pages repository
        env:
          TARGET_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          set -eu

          TARGET_DIR="$RUNNER_TEMP/pages-repo"
          git clone --depth 1 --branch "$TARGET_BRANCH" "git@github-pages-target:${TARGET_REPOSITORY}.git" "$TARGET_DIR"

          find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. "$TARGET_DIR/"

          cd "$TARGET_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --short)" ]; then
            echo "No deploy changes detected."
            exit 0
          fi

          git add -A
          git commit -m "Deploy from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin "$TARGET_BRANCH"
